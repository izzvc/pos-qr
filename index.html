<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="POS QR">
<meta name="theme-color" content="#f5f5f7">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>POS QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  .hidden { display: none !important; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 8px 0 16px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  .card { background: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  input, select { width: 100%; font-size: 17px; padding: 12px; border: 1px solid #d2d2d7; border-radius: 10px; background: #fff; color: inherit; }
  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; background: #0071e3; color: #fff; margin-top: 12px; }
  .btn.grey { background: #e8e8ed; color: #1d1d1f; }
  .btn.red { background: #fff; color: #d70015; border: 1px solid #f2c4c9; }
  .btn:disabled { opacity: .4; }
  .msg { color: #d70015; font-size: 14px; min-height: 20px; margin-top: 8px; }
  .hint { font-size: 13px; color: #6e6e73; line-height: 1.4; margin: 0; }
  .top { display: flex; gap: 8px; margin-bottom: 14px; }
  .top .btn { margin: 0; }
  .row { display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid #ececf0; }
  .row:last-child { border-bottom: none; }
  .info { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 16px; }
  .sub { font-size: 13px; color: #6e6e73; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .small { padding: 9px 14px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; background: #0071e3; color: #fff; }
  .small.ghost { background: #e8e8ed; color: #1d1d1f; }
  .empty { text-align: center; color: #6e6e73; padding: 20px 0; margin: 0; }
  .pw { display: flex; gap: 8px; }
  .pw input { flex: 1; }
  .pw button { padding: 0 14px; border: 1px solid #d2d2d7; border-radius: 10px; background: #fff; font-size: 14px; }
  #show-qr svg { width: 100%; max-width: 320px; height: auto; display: block; margin: 0 auto; background: #fff; }
  .center { text-align: center; }
  #pin { text-align: center; font-size: 28px; letter-spacing: 8px; }

  #print-area { display: none; }
  @page { size: A4; margin: 10mm; }
  @media print {
    body { background: #fff; padding: 0; }
    body > *:not(#print-area) { display: none !important; }
    #print-area { display: flex !important; flex-wrap: wrap; gap: 6mm; }
    .pitem { width: 25mm; text-align: center; break-inside: avoid; }
    .pitem svg { width: 25mm; height: 25mm; display: block; }
    .plabel { font: 7pt monospace; margin-top: 1mm; word-break: break-all; }
  }
</style>
</head>
<body>

<!-- PIN screen -->
<div id="lock" class="wrap">
  <h1>POS QR</h1>
  <div class="card">
    <h2 id="lock-title">Enter PIN</h2>
    <p class="hint" id="lock-hint"></p>
    <form id="lock-form">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
      <div class="msg" id="lock-msg"></div>
      <button class="btn" type="submit">Continue</button>
    </form>
    <button class="btn red" id="reset" type="button">Forgot PIN? Erase all</button>
  </div>
</div>

<!-- Account list -->
<div id="main" class="wrap hidden">
  <h1>POS QR</h1>
  <div class="top">
    <button class="btn" id="add">+ Add</button>
    <button class="btn grey" id="print-all">Print all</button>
  </div>
  <div class="card" id="list"></div>
  <button class="btn grey" id="lock-now">Lock app</button>
</div>

<!-- Add / edit -->
<div id="edit" class="wrap hidden">
  <div class="card">
    <h2 id="edit-title">Add account</h2>
    <form id="edit-form">
      <label for="f-label">Name (e.g. Counter 1)</label>
      <input id="f-label" type="text" autocomplete="off">
      <label for="f-user">Username</label>
      <input id="f-user" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
      <label for="f-pass">Password</label>
      <div class="pw">
        <input id="f-pass" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button type="button" id="f-toggle">Show</button>
      </div>
      <label for="f-end">After scanning, the scanner presses</label>
      <select id="f-end">
        <option value="tab-enter">Tab + Enter (logs in directly)</option>
        <option value="tab">Tab only</option>
        <option value="enter">Nothing (just username + Tab + password)</option>
      </select>
      <div class="msg" id="edit-msg"></div>
      <button class="btn" type="submit">Save</button>
    </form>
    <button class="btn grey" id="edit-cancel" type="button">Cancel</button>
    <button class="btn red hidden" id="edit-delete" type="button">Delete this account</button>
  </div>
</div>

<!-- Show QR -->
<div id="show" class="wrap hidden">
  <div class="card center">
    <h2 id="show-name"></h2>
    <div id="show-qr"></div>
    <p class="hint" style="margin-top:12px">Put the cursor in the POS username field, then scan.</p>
    <button class="btn" id="show-print">Print this QR</button>
    <button class="btn grey" id="show-close">Close</button>
  </div>
</div>

<div id="print-area"></div>

<script>
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const VKEY = 'posqr.vault';
let key = null, salt = null, accounts = [], editingId = null, firstPin = null, printing = false;

const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

function screen(id) {
  ['lock', 'main', 'edit', 'show'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
}

function loadVault() {
  try { return JSON.parse(localStorage.getItem(VKEY)); } catch (e) { return null; }
}

async function deriveKey(pin, saltBytes) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: saltBytes, iterations: 200000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function saveVault() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(accounts)));
  localStorage.setItem(VKEY, JSON.stringify({ salt: b64(salt), iv: b64(iv), data: b64(data) }));
}

/* ---------- PIN ---------- */
function showLock() {
  key = null; accounts = []; firstPin = null;
  $('pin').value = ''; $('lock-msg').textContent = '';
  $('show-qr').innerHTML = ''; $('print-area').innerHTML = '';
  const v = loadVault();
  if (!v) {
    $('lock-title').textContent = 'Set a new PIN';
    $('lock-hint').textContent = 'At least 4 digits. This PIN unlocks the app and encrypts the passwords on your phone.';
    $('reset').classList.add('hidden');
  } else {
    $('lock-title').textContent = 'Enter PIN';
    $('lock-hint').textContent = '';
    $('reset').classList.remove('hidden');
  }
  screen('lock');
}

$('lock-form').onsubmit = async e => {
  e.preventDefault();
  const pin = $('pin').value;
  const v = loadVault();
  $('lock-msg').textContent = '';

  if (!v) {
    if (pin.length < 4) { $('lock-msg').textContent = 'PIN must be at least 4 digits'; return; }
    if (firstPin === null) {
      firstPin = pin; $('pin').value = '';
      $('lock-title').textContent = 'Enter the PIN again';
      return;
    }
    if (pin !== firstPin) {
      firstPin = null; $('pin').value = '';
      $('lock-title').textContent = 'Set a new PIN';
      $('lock-msg').textContent = 'PINs do not match, try again';
      return;
    }
    salt = crypto.getRandomValues(new Uint8Array(16));
    key = await deriveKey(pin, salt);
    accounts = [];
    await saveVault();
    showMain();
    return;
  }

  try {
    salt = unb64(v.salt);
    key = await deriveKey(pin, salt);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(v.iv) }, key, unb64(v.data));
    accounts = JSON.parse(dec.decode(plain));
    showMain();
  } catch (err) {
    key = null; $('pin').value = '';
    $('lock-msg').textContent = 'Wrong PIN';
  }
};

$('reset').onclick = () => {
  if (confirm('Erase all saved accounts and set a new PIN?')) {
    localStorage.removeItem(VKEY);
    showLock();
  }
};

$('lock-now').onclick = showLock;

// Auto-lock when leaving the app
document.addEventListener('visibilitychange', () => {
  if (document.hidden && key && !printing) showLock();
});

/* ---------- List ---------- */
function showMain() { render(); screen('main'); }

function render() {
  const list = $('list');
  list.innerHTML = '';
  if (!accounts.length) {
    list.innerHTML = '<p class="empty">No accounts yet. Tap + Add.</p>';
  }
  accounts.forEach(a => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<div class="info"><div class="name"></div><div class="sub"></div></div>' +
      '<button class="small">QR</button><button class="small ghost">Edit</button>';
    row.querySelector('.name').textContent = a.label || a.user;
    row.querySelector('.sub').textContent = a.user;
    const [qrBtn, editBtn] = row.querySelectorAll('button');
    qrBtn.onclick = () => showQR(a);
    editBtn.onclick = () => openEdit(a);
    list.appendChild(row);
  });
  $('print-all').disabled = !accounts.length;
}

/* ---------- Add / edit ---------- */
function openEdit(a) {
  editingId = a ? a.id : null;
  $('edit-title').textContent = a ? 'Edit account' : 'Add account';
  $('f-label').value = a ? (a.label || '') : '';
  $('f-user').value = a ? a.user : '';
  $('f-pass').value = a ? a.pass : '';
  $('f-pass').type = 'password'; $('f-toggle').textContent = 'Show';
  $('f-end').value = a ? a.end : 'tab-enter';
  $('edit-msg').textContent = '';
  $('edit-delete').classList.toggle('hidden', !a);
  screen('edit');
}

$('add').onclick = () => openEdit(null);
$('edit-cancel').onclick = showMain;

$('f-toggle').onclick = () => {
  const p = $('f-pass');
  p.type = p.type === 'password' ? 'text' : 'password';
  $('f-toggle').textContent = p.type === 'password' ? 'Show' : 'Hide';
};

$('edit-form').onsubmit = async e => {
  e.preventDefault();
  const item = {
    label: $('f-label').value.trim(),
    user: $('f-user').value.trim(),
    pass: $('f-pass').value,
    end: $('f-end').value
  };
  if (!item.user || !item.pass) { $('edit-msg').textContent = 'Enter a username and password first.'; return; }
  if (editingId) {
    const i = accounts.findIndex(x => x.id === editingId);
    accounts[i] = { ...accounts[i], ...item };
  } else {
    accounts.push({ id: Date.now().toString(36), ...item });
  }
  await saveVault();
  showMain();
};

$('edit-delete').onclick = async () => {
  if (!confirm('Delete this account?')) return;
  accounts = accounts.filter(x => x.id !== editingId);
  await saveVault();
  showMain();
};

/* ---------- QR ---------- */
function payload(a) {
  // \t = Tab (move to password field), \n = Enter (log in)
  const suffix = { 'tab-enter': '\t\n', 'tab': '\t', 'enter': '' }[a.end] || '';
  return a.user + '\t' + a.pass + suffix;
}

function qrSvg(a) {
  const q = qrcode(0, 'M');
  q.addData(payload(a));
  q.make();
  return q.createSvgTag({ cellSize: 6, margin: 4, scalable: true });
}

function showQR(a) {
  $('show-name').textContent = a.label || a.user;
  $('show-qr').innerHTML = qrSvg(a);
  $('show-print').onclick = () => printItems([a]);
  screen('show');
}

$('show-close').onclick = () => { $('show-qr').innerHTML = ''; showMain(); };
$('print-all').onclick = () => printItems(accounts);

/* ---------- Print (A4, QR 2.5cm) ---------- */
function printItems(items) {
  const area = $('print-area');
  area.innerHTML = '';
  items.forEach(a => {
    const d = document.createElement('div');
    d.className = 'pitem';
    d.innerHTML = qrSvg(a);
    const l = document.createElement('div');
    l.className = 'plabel';
    l.textContent = a.label || a.user;
    d.appendChild(l);
    area.appendChild(d);
  });
  printing = true;
  window.print();
  setTimeout(() => { printing = false; }, 1500);
}
window.addEventListener('afterprint', () => { printing = false; });

/* ---------- Offline ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then(reg => reg.update()).catch(() => {});
  // When a new version takes over, reload once so it shows straight away
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}

showLock();
</script>
</body>
</html>
